# app·primary_region은 최상위 키다. [build] 뒤에 두면 TOML이 [build] 테이블의 필드로
# 읽어서 "the config for your app is missing an app name"으로 배포가 막힌다.
app = "open-discord-casino"
primary_region = "nrt"

[build]

[env]
  DB_PATH = "/data"
  # 비밀값이 아니라 도메인에서 그대로 나오는 고정 URL이라 시크릿이 아니라 여기에 둔다.
  # 디스코드 포털의 OAuth2 리다이렉트 등록값과 한 글자도 달라선 안 된다.
  DISCORD_OAUTH_REDIRECT_URI = "https://odcasino.kro.kr/auth/callback"
  # 디스코드 "카지노 입장" 버튼이 가리키는 주소 (도메인이 바뀌면 여기만 고친다)
  CASINO_URL = "https://odcasino.kro.kr"

[[mounts]]
  source = "discord_casino_data"
  destination = "/data"

# Gateway 상시 연결이 없는 순수 HTTP 서비스라 완전 scale-to-zero로 운영한다.
# 디스코드 인터랙션도 /discord/interactions 웹훅으로 받으므로 유휴 시 머신을 재워도 괜찮다.
[http_service]
  internal_port = 8080
  force_https = true
  # stop이 아니라 suspend를 쓴다. stop에서 깨우는 데 실측 9.05초가 걸려
  # 디스코드 인터랙션 3초 제한을 넘겼다(출석체크 버튼이 실패한다).
  # suspend는 램 스냅샷에서 재개하므로 훨씬 빠르고, 256MB는 suspend 자격 한도(2GiB) 안에 든다.
  # 절전을 껐다. 홀덤 테이블은 "요청이 올 때 판이 전진하는" 구조라 머신이 자는 동안
  # 시간이 흐르면 그 사이의 진행이 한 요청에 몰려서 풀린다 — 깨어나는 순간 여러 판이
  # 한꺼번에 처리되면서 화면이 멈춘 것처럼 보인다. 상시 가동이면 그 구간이 없다.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

# 헬스체크(http_service.checks)는 의도적으로 넣지 않았다.
# fly 문서상 헬스체크는 사설망으로 돌고 autostop은 프록시 트래픽으로 판단한다고 각각 적혀 있으나,
# "헬스체크가 머신을 깨워두는지"를 명시한 문장이 없다. 만약 깨워둔다면 절전이 무력화돼
# 요금이 상시 가동($2.02/월)으로 고정된다. 넣고 싶으면 아래로 직접 확인할 것:
#   1) 접속 없이 10분 대기 → `flyctl machine list` 상태가 suspended 인지 확인 (실측 약 7분에 전환)
#   2) checks 를 넣고 다시 10분 대기 → 여전히 suspended 인지 재확인

[[vm]]
  # 256MB에서 올렸다. 실측으로 그 크기에서는 여유가 없었다 —
  #   MemTotal 212MB · MemFree 2.8MB · MemAvailable 22MB
  # 홀덤 대회가 실제로 돌기 시작하니 그 22MB를 넘어서면서 커널이 node를 죽였다
  # (2026-08-06 14:00:13 "Out of memory: Killed process 651 (node)").
  # 죽으면 재시작까지 10초가 걸리고 그동안 모든 요청이 pending으로 쌓인다.
  #
  # 기저 사용량이 큰 이유는 프로덕션에서도 tsx로 TypeScript를 런타임 변환하기 때문이다
  # (`node --require tsx/cjs`). esbuild가 상주한다. 빌드 단계를 두어 순수 JS를 돌리면
  # 이 몫을 줄일 수 있지만, 그건 별도 작업이다 — 지금은 죽지 않는 것이 먼저다.
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
